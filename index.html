<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> My Portfolio</title>

  <!-- apply the saved theme (default: light) before paint to avoid a flash -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>


  <!-- 
    - favicon
  -->
  <link rel="shortcut icon" href="./kryz.png" type="image/svg+xml">

  <!-- 
    - custom css link
  -->
  <link rel="stylesheet" href="./assets/css/style.css">

  <!-- 
    - google font link
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

</head>

<body>

  <!-- HEADER -->

  <header class="header" data-header>
    <div class="container">

      <a href="./index.html" class="logo">Kryz-Ian</a>

      <nav class="navbar" data-navbar>
        <a href="#home" class="logo navbar-logo" data-nav-logo>Kryz-Ian</a>

        <ul class="navbar-list">

          <li>
            <a href="./index.html" class="navbar-link active" aria-current="page" data-nav-link>Home</a>
          </li>

          <li>
            <a href="./projects.html" class="navbar-link" data-nav-link>Projects</a>
          </li>

          <li>
            <a href="./skills.html" class="navbar-link" data-nav-link>Skills</a>
          </li>

          <li>
            <a href="./experience.html" class="navbar-link" data-nav-link>Work Experience</a>
          </li>

          <li>
            <a href="./certifications.html" class="navbar-link" data-nav-link>Certifications</a>
          </li>

          <li data-blog-nav>
            <a href="./blog.html" class="navbar-link" data-nav-link>Blogs</a>
          </li>

          <li>
            <a href="./contact.html" class="navbar-link" data-nav-link>Contact</a>
          </li>

        </ul>
      </nav>

      <button class="theme-toggle" aria-label="switch to dark mode" data-theme-toggle>
        <ion-icon name="moon-outline" class="icon-moon" aria-hidden="true"></ion-icon>
        <ion-icon name="sunny-outline" class="icon-sun" aria-hidden="true"></ion-icon>
      </button>

      <div class="nav-overlay" data-nav-overlay></div>

      <button class="nav-toggle-btn" aria-label="toggle menu" aria-expanded="false" data-nav-toggler>
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
      </button>

    </div>
  </header>

  <main>
    <article>

      <!-- HERO -->

      <section class="section hero" id="home" aria-label="hero">
        <div class="container">

          <figure class="hero-banner img-holder has-before" style="--width: 640; --height: 840;"
            data-hero-banner></figure>

          <div class="hero-content">

            <h1 class="section-subtitle"><span data-hero-role></span> <span id="auto-typed" class="auto-type"></span></h1>

            <h1 class="h1 hero-title" data-hero-title></h1>

            <ul class="hero-list">

              <!-- Social Media Icons -->
              <div class="social-buttons" data-social-buttons></div>

            </ul>

            <ul class="hero-list" data-hero-contact></ul>


            <a href="#contact" class="slide-down-btn" aria-label="scroll down">
              <ion-icon name="arrow-down" aria-hidden="true"></ion-icon>
            </a>

          </div>

        </div>
      </section>

      <!-- PROJECTS -->

      <section class="section portfolio" id="portfolio" aria-label="portfolio">
        <div class="container">

          <p class="section-subtitle" data-projects-subtitle></p>

          <h2 class="h2 section-title" data-projects-title></h2>

          <div class="slider" data-slider>
            <ul class="has-scrollbar" data-projects-list></ul>
            <div class="slider-arrows">
              <button class="slider-btn" data-slider-prev aria-label="previous">
                <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
              </button>
              <button class="slider-btn" data-slider-next aria-label="next">
                <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
              </button>
            </div>
            <div class="slider-controls">
              <div class="slider-track"><span class="slider-thumb" data-slider-thumb></span></div>
            </div>
          </div>

        </div>
      </section>

      <!-- SKILLS -->

      <section class="section skills has-before" id="skills" aria-label="skills" data-skills-section>
        <div class="container">

          <div class="skills-content">

            <p class="section-subtitle" data-skills-subtitle></p>

            <h2 class="h2 section-title" data-skills-title></h2>

            <ul class="skills-list" data-skills-list></ul>

          </div>

          <div class="skills-banner has-before"></div>

        </div>
      </section>


      <!-- EXPERIENCE -->

      <section class="section timeline xp-home" id="work-experience" aria-label="timeline">
        <div class="container">

          <p class="section-subtitle" data-experience-subtitle></p>

          <h2 class="h2 section-title" data-experience-title></h2>

          <ol class="xp-timeline xp-mini" data-xp-timeline>
            <span class="xp-line" aria-hidden="true"><span class="xp-line-fill" data-xp-fill></span></span>
          </ol>

        </div>
      </section>

      <!-- CERTIFICATES -->

      <section class="section news" id="certificates" aria-label="news">
        <div class="container">

          <p class="section-subtitle" data-certificates-subtitle></p>

          <h2 class="h2 section-title" data-certificates-title></h2>

          <div class="slider" data-slider>
            <ul class="has-scrollbar" data-certificates-list></ul>
            <div class="slider-arrows">
              <button class="slider-btn" data-slider-prev aria-label="previous">
                <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
              </button>
              <button class="slider-btn" data-slider-next aria-label="next">
                <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
              </button>
            </div>
            <div class="slider-controls">
              <div class="slider-track"><span class="slider-thumb" data-slider-thumb></span></div>
            </div>
          </div>

        </div>
      </section>

      <!-- BLOG -->

      <section class="section blog" id="blog" aria-label="blog" data-blog-section>
        <div class="container">

          <div class="blog-header">
            <div>
              <p class="section-subtitle" data-blog-subtitle></p>

              <h2 class="h2 section-title" data-blog-title></h2>
            </div>

            <a href="./blog.html" class="blog-see-all">
              <span>See all blogs</span>
              <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
            </a>
          </div>

          <ul class="blog-list" data-blog-list></ul>

        </div>
      </section>

      <!-- CONTACT -->

      <section class="section contact" id="contact" aria-label="contact">
        <div class="container">

          <div class="contact-content">

            <p class="section-subtitle" data-contact-subtitle></p>

            <h2 class="h2 section-title" data-contact-title></h2>

            <p class="section-text" data-contact-text></p>

            <ul class="contact-list" data-contact-list></ul>

          </div>

          <form action="https://api.web3forms.com/submit" method="POST" id="contactForm" class="contact-form">

            <input type="hidden" name="access_key" value="" data-web3forms-key>

            <input type="text" id="name" name="name" aria-label="name" placeholder="Name" required class="input-field">

            <input type="email" id="email" name="email_address" aria-label="email" placeholder="Email" required
              class="input-field">

            <textarea name="message" id="message" aria-label="message" placeholder="Message" required
              class="input-field"></textarea>

            <button type="submit" class="submit-btn">
              <span class="span">Submit</span>

              <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
            </button>

          </form>

        </div>
      </section>

    </article>
  </main>

  <!-- FOOTER -->

  <footer class="footer">
    <div class="container">

      <p class="copyright" data-copyright></p>

      <ul class="social-list" data-social-list></ul>

    </div>
  </footer>

  <!-- typing animation for the hero -->
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js" defer></script>

  <!-- renders the page from content/content.json and content/blog.json (edited via /admin/) -->
  <script src="./assets/js/common.js" defer></script>
  <script src="./assets/js/lightbox.js" defer></script>
  <script src="./assets/js/render.js" defer></script>
  <script src="./assets/js/home.js" defer></script>

  <!-- custom js link -->
  <script src="./assets/js/script.js" defer></script>

  <!-- ionicon link -->
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
