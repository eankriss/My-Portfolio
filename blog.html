<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs — Kryz-Ian</title>

  <!-- apply the saved theme (default: light) before paint to avoid a flash -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>


  <link rel="shortcut icon" href="./kryz.png" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

</head>

<body class="page-sticky-footer">

  <!-- HEADER -->

  <header class="header active" data-header>
    <div class="container">

      <a href="./index.html" class="logo">Kryz-Ian</a>

      <nav class="navbar" data-navbar>
        <a href="./index.html" class="logo navbar-logo" data-nav-logo>Kryz-Ian</a>

        <ul class="navbar-list">

          <li>
            <a href="./index.html" class="navbar-link" data-nav-link>Home</a>
          </li>

          <li>
            <a href="./projects.html" class="navbar-link" data-nav-link>Projects</a>
          </li>

          <li>
            <a href="./skills.html" class="navbar-link" data-nav-link>Skills</a>
          </li>

          <li>
            <a href="./experience.html" class="navbar-link" data-nav-link>Work Experience</a>
          </li>

          <li>
            <a href="./certifications.html" class="navbar-link" data-nav-link>Certifications</a>
          </li>

          <li data-blog-nav>
            <a href="./blog.html" class="navbar-link active" aria-current="page" data-nav-link>Blogs</a>
          </li>

          <li>
            <a href="./contact.html" class="navbar-link" data-nav-link>Contact</a>
          </li>

        </ul>
      </nav>

      <button class="theme-toggle" aria-label="switch to dark mode" data-theme-toggle>
        <ion-icon name="moon-outline" class="icon-moon" aria-hidden="true"></ion-icon>
        <ion-icon name="sunny-outline" class="icon-sun" aria-hidden="true"></ion-icon>
      </button>

      <div class="nav-overlay" data-nav-overlay></div>

      <button class="nav-toggle-btn" aria-label="toggle menu" aria-expanded="false" data-nav-toggler>
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
      </button>

    </div>
  </header>

  <main>
    <article>

      <!-- PAGE HEADER -->

      <section class="page-hero" aria-label="blogs">
        <div class="container">
          <nav class="breadcrumb" aria-label="breadcrumb">
            <a href="./index.html">Home</a>
            <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
            <span aria-current="page">Blogs</span>
          </nav>

          <p class="section-subtitle" data-blog-subtitle>Blogs</p>

          <h1 class="h1 page-title" data-blog-title>All Posts</h1>
        </div>
      </section>

      <!-- POSTS -->

      <section class="section blog page-body" aria-label="blog archive">
        <div class="container">

          <div class="blog-toolbar" data-blog-toolbar hidden>
            <label class="blog-search">
              <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
              <input type="search" placeholder="Search posts…" aria-label="search posts" data-blog-search>
            </label>

            <div class="filter-chips" role="group" aria-label="filter by tag" data-blog-tags></div>

            <p class="gallery-count" aria-live="polite" data-blog-count></p>
          </div>

          <ul class="blog-list blog-archive" data-blog-list></ul>

        </div>
      </section>

      <!-- GET IN TOUCH -->

      <section class="section cta" aria-label="get in touch">
        <div class="container">

          <div class="cta-card">
            <div class="cta-content">
              <p class="section-subtitle" data-cta-subtitle>Get In Touch</p>

              <h2 class="h2 section-title" data-cta-title>Let's work together</h2>

              <p class="section-text" data-cta-text>Have a project in mind or just want to say hello? I'd love to hear from you.</p>
            </div>

            <a href="./contact.html" class="cta-btn">
              <span data-cta-button>Contact Me</span>
              <ion-icon name="arrow-forward" aria-hidden="true"></ion-icon>
            </a>
          </div>

        </div>
      </section>

    </article>
  </main>

  <!-- FOOTER -->

  <footer class="footer">
    <div class="container">

      <p class="copyright" data-copyright></p>

      <ul class="social-list" data-social-list></ul>

    </div>
  </footer>

  <script src="./assets/js/common.js" defer></script>
  <script src="./assets/js/lightbox.js" defer></script>
  <script src="./assets/js/blog.js" defer></script>
  <script src="./assets/js/script.js" defer></script>

  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
